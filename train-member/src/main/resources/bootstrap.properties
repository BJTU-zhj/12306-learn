#nacos server地址--配置中心
spring.cloud.nacos.config.server-addr=127.0.0.1:8848

#下边三个配置组合起来是dataId的名字
#配置中心的名字
spring.application.name=train-member
#启动环境，nacos会根据环境读不同的配置dataId:train-member-dev.properties
spring.profiles.active=dev
#配置中心文件后缀，默认properties
spring.cloud.nacos.config.file-extension=properties
#命名空间
spring.cloud.nacos.config.namespace=93653a10-9f0d-419e-a8dc-7f864a60d97c


 #注册中心server地址
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848
spring.cloud.nacos.discovery.namespace=93653a10-9f0d-419e-a8dc-7f864a60d97c

#分布式事务组件seata
#事务组名称
seata.tx-service-group=train-group
#事务组和seata集群做关联
seata.service.vgroup-mapping.train-group=default
#seata集群对应的机器
seata.service.grouplist.default=127.0.0.1:8091