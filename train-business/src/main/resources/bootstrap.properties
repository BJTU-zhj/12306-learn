#nacos server地址--配置中心
spring.cloud.nacos.config.server-addr=127.0.0.1:8848

 #注册中心server地址
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848
spring.cloud.nacos.discovery.namespace=93653a10-9f0d-419e-a8dc-7f864a60d97c

#引入redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=123456

#将springboot缓存设置为redis
spring.cache.type=redis
spring.cache.redis.key-prefix=train_cache_
spring.cache.redis.time-to-live=3600s
spring.cache.redis.cache-null-values=true

#分布式事务组件seata
#事务组名称--所有互相调用的微服务（如：会员模块、购票模块、网关模块）通常都应该配置成同一个
seata.tx-service-group=train-group
#事务组和seata集群做关联
seata.service.vgroup-mapping.train-group=default
#seata集群对应的机器
seata.service.grouplist.default=127.0.0.1:8091