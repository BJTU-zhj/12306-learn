#nacos server地址--配置中心
spring.cloud.nacos.config.server-addr=127.0.0.1:8848

 #注册中心server地址
spring.cloud.nacos.discovery.server-addr=127.0.0.1:8848
spring.cloud.nacos.discovery.namespace=93653a10-9f0d-419e-a8dc-7f864a60d97c

#引入redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=123456

#将springboot缓存设置为redis
spring.cache.type=redis
spring.cache.redis.key-prefix=train_cache_
spring.cache.redis.time-to-live=3600s
spring.cache.redis.cache-null-values=true



#对于已经注册到nacos的seata-server,seata-cli通过以下注册，并使用naco配置
seata.registry.type=nacos
seata.registry.nacos.application=seata-server
seata.registry.nacos.server-addr=127.0.0.1:8848
seata.registry.nacos.namespace=93653a10-9f0d-419e-a8dc-7f864a60d97c
seata.registry.nacos.group=SEATA_GROUP
seata.registry.nacos.username=nacos
seata.registry.nacos.password=nacos

#seata-cli配置中心,这样配置是用的seata-server配置中心，可以不用相同的
seata.config.type=nacos
seata.config.nacos.server-addr=127.0.0.1:8848
seata.config.nacos.group=SEATA_GROUP
seata.config.nacos.namespace=93653a10-9f0d-419e-a8dc-7f864a60d97c
seata.config.nacos.data-id=seataServerCli.properties
seata.config.nacos.username=nacos
seata.config.nacos.password=nacos


#分布式事务组件seata
#事务组名称--所有互相调用的微服务（如：会员模块、购票模块、网关模块）通常都应该配置成同一个
seata.tx-service-group=train-group


#链接到sentinel控制台
spring.cloud.sentinel.transport.port=18080
spring.cloud.sentinel.transport.dashboard=127.0.0.1:18080

#为了在重启应用后依旧使得规则生效，可以链接nacos,将规则配置放置在nacos
spring.cloud.sentinel.datasource.flow.nacos.server-addr=127.0.0.1:8848
spring.cloud.sentinel.datasource.flow.nacos.data-id=sentinel-business-flow
spring.cloud.sentinel.datasource.flow.nacos.group-id=DEFAULT_GROUP
spring.cloud.sentinel.datasource.flow.nacos..namespace=93653a10-9f0d-419e-a8dc-7f864a60d97c
spring.cloud.sentinel.datasource.flow.nacos.rule-type=flow

#配置链路不为默认，为了使用规则中的链路模式
spring.cloud.sentinel.web-context-unify=false

